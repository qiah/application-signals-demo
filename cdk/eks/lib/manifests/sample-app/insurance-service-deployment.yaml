apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-service-python
  namespace: namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: insurance-service-python
  template:
    metadata:
      labels:
        io.kompose.service: insurance-service-python
    spec:
      serviceAccountName: visits-service-account
      containers:
        - image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/python-petclinic-insurance-service:latest
          # securityContext:
          #   runAsNonRoot: true
          #   allowPrivilegeEscalation: true
          name: insurance-service-python
          env:
            - name: OTEL_SERVICE_NAME
              value: insurance-service-python
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=pet-clinic
            # Service DNS of the CloudWatch Observability add-on agent - not localhost.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # Python needs this for application logs over OTLP.
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: DJANGO_SETTINGS_MODULE
              value: pet_clinic_insurance_service.settings
            - name: PYTHONPATH
              value: /app
            - name: EUREKA_SERVER_URL
              value: discovery-server
            - name: DB_NAME
              value: 'postgres'
            - name: DB_USER
              value: 'djangouser'
            - name: DATABASE_PROFILE
              value: postgresql
            - name: DB_SERVICE_HOST
              value: <HOST>
            - name: DB_SERVICE_PORT
              value: '5432'
          # command: ["sh", "-c"]
          # args: ['manage.py', 'runserver', '0.0.0.0:8000']
          command: ['sh', '-c']
          args:
            - |
              python manage.py migrate
              python manage.py loaddata initial_data.json
              opentelemetry-instrument python manage.py runserver 0.0.0.0:8000 --noreload
          ports:
            - containerPort: 8000
          # lifecycle:
          #   postStart:
          #     exec:
          #       command:
          #         - sh
          #         - -c
          #         - 'python manage.py migrate && python manage.py loaddata initial_data.json'
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
      restartPolicy: Always
