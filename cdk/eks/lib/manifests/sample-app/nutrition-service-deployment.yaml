apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-service-nodejs
  namespace: namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: nutrition-service-nodejs
  template:
    metadata:
      labels:
        io.kompose.service: nutrition-service-nodejs
    spec:
      serviceAccountName: visits-service-account
      containers:
        - image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/nodejs-petclinic-nutrition-service:latest
          name: nutrition-service-nodejs
          env:
            - name: OTEL_SERVICE_NAME
              value: nutrition-service-nodejs
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=pet-clinic
            # Service DNS of the CloudWatch Observability add-on agent - not localhost.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: EUREKA_SERVER_URL
              value: http://discovery-server:8761/eureka
            - name: MONGO_URI
              value: mongodb://admin:admin@mongodb:27017/
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /nutrition
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 60
      restartPolicy: Always
